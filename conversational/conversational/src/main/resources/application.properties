spring.application.name=conversational

# AI & OpenRouter Configuration
spring.ai.openai.api-key=${OPEN_ROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=meta-llama/llama-3.1-8b-instruct

# Database Configuration (Fixed prefix)
spring.datasource.url=jdbc:postgresql://localhost:5432/conversational_ai
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver