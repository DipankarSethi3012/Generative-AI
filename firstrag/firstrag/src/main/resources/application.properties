spring.application.name=firstrag

spring.ai.openai.api-key=${OPEN_ROUTER_API_KEY}

spring.ai.openai.base-url=https://openrouter.ai/api/v1

spring.ai.openai.chat.options.model=meta-llama/llama-3.1-8b-instruct

# Response token limit
spring.ai.openai.chat.options.max-tokens=200

# Optional tuning
spring.ai.openai.chat.options.temperature=0.7


# =========================================================
# SPRING AI + WEBCLIENT LOGGING
# =========================================================

# Spring AI logs
logging.level.org.springframework.ai=DEBUG

# Advisors logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.chat.client.advisor.api=DEBUG

# OpenAI client logs
logging.level.org.springframework.ai.openai=DEBUG

# WebClient request/response logs
logging.level.org.springframework.web.reactive.function.client=DEBUG

# Reactor Netty HTTP logs
logging.level.reactor.netty.http.client=DEBUG
logging.level.reactor.netty.transport=DEBUG

# HTTP codec logs
logging.level.org.springframework.http.codec=TRACE

# Request details
spring.codec.log-request-details=true

# Full wiretap logging
reactor.netty.http.client.wiretap=true
